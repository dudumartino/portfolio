# Build com Vite e envio da pasta build/ para a Hostinger via FTP.
# Roda a cada push na main ou manualmente pela aba Actions.
# Secrets necessários (Settings › Secrets and variables › Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
# Variável opcional (aba Variables): VITE_USE_FIREBASE = true para ler os projetos
# do Firestore; ausente ou false usa a lista local de src/data/projetos.js.
name: Deploy na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dois deploys ao mesmo tempo; o mais novo espera o anterior terminar
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_USE_FIREBASE: ${{ vars.VITE_USE_FIREBASE }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Com o Firebase ligado e sem as chaves, o build passa, mas a seção Projetos quebra em produção
      - name: Verificar secrets do Firebase
        if: vars.VITE_USE_FIREBASE == 'true'
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
                   VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v não configurado"; exit 1; fi
          done

      - run: npm ci

      - run: npm run build

      - name: Enviar para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./build/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
